# Copy to .github/dependabot.yml. Add one block per ecosystem in the repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm # {{pip | cargo | gomod | gradle | swift | docker | terraform}}
    directory: / # {{path to the manifest}}
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
