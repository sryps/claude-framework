# Optional. Runs the same local check, scripts/verify.sh, on GitHub runners.
# Nothing in the framework depends on this file. Run `make verify` locally.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install jq shellcheck; else sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck; fi
      - name: Verify
        run: bash scripts/verify.sh
