# Optional. Runs the same local check, .claude/framework/verify.sh, on GitHub
# runners. Nothing in the framework depends on this file.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install jq shellcheck; else sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck; fi
      - name: Verify
        run: bash .claude/framework/verify.sh
