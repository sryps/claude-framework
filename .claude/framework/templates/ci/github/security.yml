# Security scans for pull requests and the default branch.
# Copy to .github/workflows/security.yml.
#
# Every action is pinned to a full commit SHA, with the tag in a trailing
# comment. Dependabot (github-actions ecosystem) keeps the pins current.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  semgrep:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan
        run: semgrep scan --config p/default --sarif --output semgrep.sarif --metrics off --error --severity ERROR
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: semgrep.sarif

  osv-scanner:
    name: dependency vulnerabilities
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Skip, with a notice, when the repository's dependency graph is off.
      # The framework does not change repository settings; osv-scanner still
      # checks dependencies for known vulnerabilities.
      - name: Check dependency graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        # Only a 404 means the graph is off. Any other error (rate limit,
        # outage, token problem) fails the job instead of skipping the review.
        run: |
          status=$(gh api -i "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" 2>/dev/null | head -1 | awk '{print $2}')
          case "$status" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Dependency review skipped::The dependency graph is off for this repository (Settings > Code security). osv-scanner still checks dependencies." ;;
            *)
              echo "::error title=Dependency graph check failed::GitHub API returned '${status:-no response}'. Not skipping dependency review on an unknown state."
              exit 1 ;;
          esac
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: on-failure

  trivy:
    name: filesystem and container config scan
    # Most useful when the repo has a Dockerfile, IaC, or Kubernetes files.
    # Remove this job when the repo has none of these.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: trivy.sarif
